# Runs with tox-uv, which fetches missing Python versions: `uv run tox -p auto`
[tox]
env_list =
    lint
    py{310,311,312,313,314}-django52
    py{312,313,314}-django{60,61}
    py310-django52-anymail150

[testenv]
runner = uv-venv-runner
dependency_groups =
deps =
    pytest>=8
    pytest-django>=4.9
    pytest-cov>=6
    django52: django~=5.2.0
    django60: django~=6.0.0
    django61: django~=6.1.0
    anymail150: django-anymail==15.0
commands = pytest --cov --cov-report=term-missing {posargs}
passenv = LETTERMINT_TEST_*

[testenv:lint]
deps =
    ruff
    mypy
    django-stubs
    types-requests
    pytest
commands =
    ruff check .
    ruff format --check .
    mypy
